name: educonnect
description: "EduConnect - aplikasi pencarian tutor terdekat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.0.0
  supabase_flutter: ^2.5.6
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  google_maps_flutter: ^2.12.3
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  fluentui_system_icons: ^1.1.273
  file_picker: ^6.1.1
  intl: ^0.19.0
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.3
  flutter_pdfview: ^1.3.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
